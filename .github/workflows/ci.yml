name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 20
  VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY != '' && secrets.VITE_FIREBASE_API_KEY || 'demo-api-key' }}
  VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN != '' && secrets.VITE_FIREBASE_AUTH_DOMAIN || 'demo-project.firebaseapp.com' }}
  VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID != '' && secrets.VITE_FIREBASE_PROJECT_ID || 'demo-project' }}
  VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET != '' && secrets.VITE_FIREBASE_STORAGE_BUCKET || 'demo-project.appspot.com' }}
  VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID != '' && secrets.VITE_FIREBASE_MESSAGING_SENDER_ID || '1234567890' }}
  VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID != '' && secrets.VITE_FIREBASE_APP_ID || '1:1234567890:web:demo' }}
  VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
  E2E_AUTH_READY: ${{ secrets.VITE_FIREBASE_API_KEY != '' && secrets.VITE_FIREBASE_AUTH_DOMAIN != '' && secrets.VITE_FIREBASE_PROJECT_ID != '' && secrets.VITE_FIREBASE_STORAGE_BUCKET != '' && secrets.VITE_FIREBASE_MESSAGING_SENDER_ID != '' && secrets.VITE_FIREBASE_APP_ID != '' && secrets.E2E_EMAIL != '' && secrets.E2E_PASSWORD != '' && 'true' || 'false' }}

jobs:
  quality:
    name: Lint, Unit, Coverage, Build
    runs-on: ubuntu-latest
    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Run quality gate
        run: npm run ci:quality

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage
          if-no-files-found: ignore

      - name: Upload built app artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist
          if-no-files-found: error

  e2e-public:
    name: E2E Public
    runs-on: ubuntu-latest
    needs: quality
    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download built app artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run public E2E tests
        run: npm run e2e:public

      - name: Upload Playwright public report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-public
          path: playwright-report
          if-no-files-found: ignore

      - name: Upload Playwright public raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-public
          path: test-results
          if-no-files-found: ignore

  e2e-auth:
    name: E2E Auth
    runs-on: ubuntu-latest
    needs: quality
    if: ${{ env.E2E_AUTH_READY == 'true' }}
    env:
      CI: true
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download built app artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run auth E2E tests
        run: npm run e2e:auth

      - name: Print auth setup status
        if: always()
        run: |
          if [ -f e2e/.auth/status.json ]; then
            cat e2e/.auth/status.json
          else
            echo "No auth status file was produced."
          fi

      - name: Upload auth setup status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-auth-status
          path: e2e/.auth/status.json
          if-no-files-found: ignore

      - name: Upload Playwright auth report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-auth
          path: playwright-report
          if-no-files-found: ignore

      - name: Upload Playwright auth raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-auth
          path: test-results
          if-no-files-found: ignore

  cd-artifact:
    name: CD Build Artifact
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.quality.result == 'success' && needs.e2e-public.result == 'success' && (needs.e2e-auth.result == 'success' || needs.e2e-auth.result == 'skipped') }}
    runs-on: ubuntu-latest
    needs:
      - quality
      - e2e-public
      - e2e-auth

    steps:
      - name: Download built app artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist

      - name: Upload production dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-dist
          path: dist
          if-no-files-found: error

